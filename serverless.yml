service: url-shortener
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  stackName: url-shortener-${self:provider.stage}

  environment: ${file(./serverless/environment.yml):${self:provider.stage}}

  iam:
    role:
      statements: ${file(./serverless/iam-resources.yml):statements}

custom: ${file(./serverless/custom.yml):${self:provider.stage}}

functions: ${file(./serverless/functions.yml):functions}

resources:
  - ${file(./serverless/dynamodb-resources.yml)}

package:
  individually: true
  patterns:
    - '!**'              # exclude everything first
    - 'shared/**'        # include shared code
    - 'package.json'
    - 'node_modules/**'

    # explicitly exclude junk
    - '!.github/**'
    - '!serverless/**'
    - '!*.md'  