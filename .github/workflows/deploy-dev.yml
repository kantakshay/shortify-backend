name: API Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS (Dev)
    runs-on: ubuntu-latest
    # Only reviewed code reaches dev: run from any other branch, the job is
    # skipped. A branch could delete this line in its own copy of the workflow,
    # so the real lock is the dev environment's "Deployment branches" rule in
    # GitHub settings (main and develop only), and the AWS role trusts only
    # environment:dev.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: dev
    # id-token: write lets GitHub issue this job a short-lived OIDC token, which
    # AWS swaps for temporary credentials (no stored AWS keys). Setting
    # permissions here turns everything else off, so checkout needs contents: read.
    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Checkout the same branch from which workflow is triggered
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # 2. Setup Node.js (same major as the Lambda runtime, nodejs24.x)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # 3. Install dependencies (includes Serverless Framework v4)
      - name: Install dependencies
        run: npm ci

      # 4. Run unit tests: a failing test stops the deploy
      - name: Run tests
        run: npm test

      # 5. Log in to AWS with OIDC: AWS checks the GitHub token against the
      #    deploy role's trust policy (this repo, environment dev) and returns
      #    credentials that expire on their own. The role ARN isn't secret, so
      #    it's a variable on the dev environment. The session name shows up in
      #    CloudTrail, so every AWS action can be traced back to its run.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ap-south-1

      # 6. Deploy to AWS (Serverless v4 signs in with an access key)
      - name: Deploy to AWS (dev)
        run: npx serverless deploy --stage dev --region ap-south-1
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

      # 7. Throttle the whole dev API: requests over the limit get 429 and never
      #    reach Lambda or DynamoDB. Serverless has no setting for stage throttling.
      - name: Set API throttling (dev)
        env:
          RATE_LIMIT: 10 # requests per second, steady
          BURST_LIMIT: 20 # requests allowed at once
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='dev-url-shortener'].id | [0]" --output text)
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "REST API 'dev-url-shortener' not found" >&2
            exit 1
          fi
          aws apigateway update-stage --rest-api-id "$API_ID" --stage-name dev \
            --patch-operations \
              "op=replace,path=/*/*/throttling/rateLimit,value=$RATE_LIMIT" \
              "op=replace,path=/*/*/throttling/burstLimit,value=$BURST_LIMIT"

      # 8. Show which branch and commit is now running on dev. The values go in
      #    through env, not ${{ }} inside the script, so a branch name can't
      #    inject shell commands.
      - name: Deployment summary
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "### Deployed to dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"

      # 9. Smoke test: use the live API like a real user would, and check that
      #    the table is still protected. "AWS accepted the deploy" doesn't mean
      #    "the API works"; any mismatch fails the run. The test link expires in
      #    10 minutes and, like every expired link, stays in the table (codes
      #    are never reused), so each deploy leaves one harmless retired item.
      - name: Smoke test (dev)
        env:
          TABLE_NAME: url-shortener-dev
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          fail() { echo "Smoke test failed: $*" >&2; exit 1; }
          CURL="curl -sS --max-time 15 --retry 3 --retry-delay 5"

          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='dev-url-shortener'].id | [0]" --output text)
          [ -n "$API_ID" ] && [ "$API_ID" != "None" ] || fail "REST API 'dev-url-shortener' not found"
          API="https://$API_ID.execute-api.ap-south-1.amazonaws.com/dev"
          TARGET="https://example.com/shortify-smoke-test/$RUN_ID"
          EXPIRES=$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)

          # 1. Create a link: expect 201 and a short code
          BODY=$(jq -n --arg url "$TARGET" --arg exp "$EXPIRES" '{url: $url, expiresAt: $exp}')
          STATUS=$($CURL -o create.json -w '%{http_code}' -X POST "$API/shorten" \
            -H 'Content-Type: application/json' -d "$BODY")
          [ "$STATUS" = "201" ] || fail "POST /shorten returned $STATUS: $(cat create.json)"
          CODE=$(jq -r '.short_code' create.json)
          [[ "$CODE" =~ ^[a-z0-9]+$ ]] || fail "unexpected short_code: $CODE"
          echo "Created $CODE"

          # 2. Open it without following the redirect: expect 302 to the exact URL
          OUT=$($CURL -o /dev/null -w '%{http_code} %{redirect_url}' "$API/$CODE")
          STATUS=${OUT%% *}
          LOCATION=${OUT#* }
          [ "$STATUS" = "302" ] || fail "GET /$CODE returned $STATUS"
          [ "$LOCATION" = "$TARGET" ] || fail "GET /$CODE redirected to '$LOCATION', expected '$TARGET'"
          echo "Redirect OK"

          # 3. Analytics: expect 200 and the click counted. The read is eventually
          #    consistent, so a click can take a moment to show; try a few times.
          for attempt in 1 2 3 4 5; do
            STATUS=$($CURL -o analytics.json -w '%{http_code}' "$API/analytics/$CODE")
            [ "$STATUS" = "200" ] || fail "GET /analytics/$CODE returned $STATUS: $(cat analytics.json)"
            CLICKS=$(jq -r '.clicks' analytics.json)
            [ "$CLICKS" -ge 1 ] 2>/dev/null && break
            [ "$attempt" = "5" ] && fail "click not counted: clicks=$CLICKS"
            sleep 2
          done
          echo "Analytics OK (clicks=$CLICKS)"

          # 4. The table must still be protected: an old commit's deploy once
          #    switched these off.
          PITR=$(aws dynamodb describe-continuous-backups --table-name "$TABLE_NAME" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' --output text)
          [ "$PITR" = "ENABLED" ] || fail "point-in-time recovery is $PITR"
          PROTECTED=$(aws dynamodb describe-table --table-name "$TABLE_NAME" \
            --query 'Table.DeletionProtectionEnabled' --output text)
          [ "$PROTECTED" = "True" ] || fail "deletion protection is $PROTECTED"
          echo "Table protection OK"

          echo "- Smoke test: passed (\`$CODE\`)" >> "$GITHUB_STEP_SUMMARY"
