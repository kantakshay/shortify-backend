name: API Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS (Dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # 1. Checkout the same branch from which workflow is triggered
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # 2. Setup Node.js (same major as the Lambda runtime, nodejs24.x)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # 3. Install dependencies (includes Serverless Framework v4)
      - name: Install dependencies
        run: npm ci

      # 4. Run unit tests: a failing test stops the deploy
      - name: Run tests
        run: npm test

      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 6. Deploy to AWS (Serverless v4 signs in with an access key)
      - name: Deploy to AWS (dev)
        run: npx serverless deploy --stage dev --region ap-south-1
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

      # 7. Throttle the whole dev API: requests over the limit get 429 and never
      #    reach Lambda or DynamoDB. Serverless has no setting for stage throttling.
      - name: Set API throttling (dev)
        env:
          RATE_LIMIT: 10 # requests per second, steady
          BURST_LIMIT: 20 # requests allowed at once
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='dev-url-shortener'].id | [0]" --output text)
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "REST API 'dev-url-shortener' not found" >&2
            exit 1
          fi
          aws apigateway update-stage --rest-api-id "$API_ID" --stage-name dev \
            --patch-operations \
              "op=replace,path=/*/*/throttling/rateLimit,value=$RATE_LIMIT" \
              "op=replace,path=/*/*/throttling/burstLimit,value=$BURST_LIMIT"

      # 8. Show which branch and commit is now running on dev. The values go in
      #    through env, not ${{ }} inside the script, so a branch name can't
      #    inject shell commands.
      - name: Deployment summary
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "### Deployed to dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
