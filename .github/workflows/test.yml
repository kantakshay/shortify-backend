name: Tests

# Runs lint, the format check and the unit tests on every pull request and on
# pushes to the main branches. DynamoDB is mocked, so no AWS secrets are needed.
on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege for the built-in GITHUB_TOKEN: tests only need to read the
# code, so even a compromised step can't push commits or edit PRs.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test
