name: Tests

# Runs the unit tests on every pull request and on pushes to the main branches.
# DynamoDB is mocked, so no AWS credentials or secrets are needed.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
