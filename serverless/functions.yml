functions:

  createUrl:
    handler: functions/create-url/handler.main
    events:
      - http:
          path: /shorten
          method: post
    package:
      patterns:
        - 'functions/create-url/**'
        - 'shared/**'
        - 'node_modules/**'
        - 'package.json'

  redirect:
    handler: functions/redirect-url/handler.main
    events:
      - http:
          path: /{short_code}
          method: get
    package:
      patterns:
        - 'functions/redirect-url/**'
        - 'shared/**'
        - 'node_modules/**'
        - 'package.json'