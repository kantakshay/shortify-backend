functions:

  createUrl:
    handler: functions/create-url/handler.main
    events:
      - http:
          path: /shorten
          method: post
    package:
      patterns:
        - 'functions/create-url/**'
        - '!functions/create-url/test/**'
        - 'shared/**'
        - 'node_modules/**'
        - 'package.json'

  redirect:
    handler: functions/redirect-url/handler.main
    events:
      - http:
          path: /{short_code}
          method: get
    package:
      patterns:
        - 'functions/redirect-url/**'
        - '!functions/redirect-url/test/**'
        - 'shared/**'
        - 'node_modules/**'
        - 'package.json'

  analytics:
    handler: functions/analytics/handler.main   
    events:
      - http:
          path: /analytics/{short_code}
          method: get
    package:
      patterns:
        - 'functions/analytics/**'
        - '!functions/analytics/test/**'
        - 'shared/**'
        - 'node_modules/**'
        - 'package.json'