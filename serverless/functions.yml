functions:
  createUrl:
    handler: functions/create-url/handler.main
    iam:
      role:
        statements:
          # Write new links only
          - Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource:
              Fn::GetAtt: [UrlTable, Arn]
    events:
      - http:
          path: /shorten
          method: post
          cors: true
    package:
      patterns:
        - "functions/create-url/**"
        - "!functions/create-url/test/**"
        - "shared/**"
        - "!shared/test/**"
        - "node_modules/**"
        - "package.json"

  redirect:
    handler: functions/redirect-url/handler.main
    iam:
      role:
        statements:
          # Look up the link and update its click counter
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt: [UrlTable, Arn]
    events:
      - http:
          path: /{short_code}
          method: get
          cors: true
    package:
      patterns:
        - "functions/redirect-url/**"
        - "!functions/redirect-url/test/**"
        - "shared/**"
        - "!shared/test/**"
        - "node_modules/**"
        - "package.json"

  analytics:
    handler: functions/analytics/handler.main
    iam:
      role:
        statements:
          # Read only
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource:
              Fn::GetAtt: [UrlTable, Arn]
    events:
      - http:
          path: /analytics/{short_code}
          method: get
          cors: true
    package:
      patterns:
        - "functions/analytics/**"
        - "!functions/analytics/test/**"
        - "shared/**"
        - "!shared/test/**"
        - "node_modules/**"
        - "package.json"
